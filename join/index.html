<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join a table — Kitchen Table: Five Hundred</title>
<meta name="robots" content="noindex">
<!-- Safari shows the App Clip card (or the app banner) for invite links. The clip opens straight on this table. -->
<meta name="apple-itunes-app" content="app-id=6827233529, app-clip-bundle-id=com.drewclarke.fivehundred.Clip, app-clip-display=card">
<style>
  :root { color-scheme: dark; --bg: #0d2a33; --ink: #f1ead8; --mute: #b9c6c2; --gold: #e8c98a; --you: #9ad1b5; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 Georgia, "Iowan Old Style", serif; }
  main { max-width: 32rem; margin: 0 auto; padding: 48px 20px 64px; text-align: center; }
  h1 { font-weight: 500; font-size: 1.6rem; margin: 0 0 8px; }
  .sub { color: var(--mute); }
  .code { font: 600 2.4rem/1.2 ui-monospace, monospace; letter-spacing: 0.25em; color: var(--gold); margin: 24px 0; }
  .btn { display: inline-block; background: var(--you); color: #0d2a33; text-decoration: none; font-weight: 600; padding: 14px 28px; border-radius: 12px; margin: 8px 0; }
  a { color: var(--gold); }
</style>
</head>
<body>
<main>
  <h1>You're invited to a table</h1>
  <p class="sub">Kitchen Table: Five Hundred</p>
  <div class="code" id="code" aria-label="Table code"></div>
  <p id="open-wrap"><a class="btn" id="open" href="#">Open in the app</a></p>
  <p><a id="store" href="https://apps.apple.com/app/id6827233529">Get the app on the App Store</a></p>
  <p class="sub" id="how">No app yet? Install Kitchen Table: Five Hundred from the App Store, open Play with Friends and enter the code above under Join a table.</p>
  <p class="sub"><a href="../#privacy">Privacy</a> · <a href="../#support">Support</a></p>
</main>
<script>
  // Game Center's link for "Join a friend's table" carries a party code (?c=XXXX-XXXX) instead of the table code.
  // Same mapping as codeToParty/partyToCode in the app (artifacts/web/index.html).
  function partyToCode(party) {
    var P = "23456789CFGHJMPQRVWX", T = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    var t = String(party || "").toUpperCase().replace(/[^0-9A-Z]/g, ""), n = 0, o = "", i, k;
    if (t.length !== 8) return "";
    for (i = 0; i < 8; i++) { k = P.indexOf(t[i]); if (k < 0) return ""; n = n * 20 + k; }
    if (n >= Math.pow(32, 6)) return "";
    for (i = 0; i < 6; i++) { o = T[n % 32] + o; n = Math.floor(n / 32); }
    return o;
  }
  var q = new URLSearchParams(location.search);
  var c = (q.get("code") || partyToCode(q.get("c")) || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
  var el = document.getElementById("code");
  if (c) {
    el.textContent = c;
    document.getElementById("open").href = "kitchentable500://join/" + c;
  } else {
    el.textContent = "";
    document.getElementById("open-wrap").hidden = true;
    document.getElementById("how").textContent = "This invite link is missing its table code. Ask the host to send it again, or enter the code in Play with Friends under Join a table.";
  }
</script>
</body>
</html>
